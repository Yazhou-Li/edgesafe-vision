[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesafe-vision"
version = "0.1.0"
description = "Edge AI safety monitoring reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yazhou Li"}
]
keywords = [
  "edge-ai",
  "edge-computing",
  "computer-vision",
  "video-analytics",
  "frigate",
  "openvino",
  "rtsp",
  "safety-monitoring",
  "fde"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/Yazhou-Li/edgesafe-vision"
Repository = "https://github.com/Yazhou-Li/edgesafe-vision"
Issues = "https://github.com/Yazhou-Li/edgesafe-vision/issues"
Documentation = "https://github.com/Yazhou-Li/edgesafe-vision/tree/main/docs"

[project.scripts]
edgesafe-doctor = "edgesafe.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
