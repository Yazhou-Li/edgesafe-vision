[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesafe-vision"
version = "0.1.0"
description = "Edge AI safety monitoring reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yazhou Li"}
]
keywords = [
  "edge-ai",
  "computer-vision",
  "frigate",
  "openvino",
  "rtsp",
  "safety-monitoring",
  "fde"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.scripts]
edgesafe-doctor = "edgesafe.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
